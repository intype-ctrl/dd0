workflows:
  ios_release_testflight:
    name: iOS Release (Internal Test)
    instance_type: mac_mini_m1

    # (권장) App Store Connect 통합 키 이름 지정
    integrations:
      app_store_connect: gdn0   # 팀 Integrations에 등록한 키 이름

    environment:
      flutter: stable
      xcode: latest

      # ✅ ios_signing은 environment 안쪽에!
      ios_signing:
        distribution_type: app_store        # ← 언더스코어
        bundle_identifier: com.ver1.gdn0    # ← 직접 명시 (변수 참조도 가능)

      vars:
        BUNDLE_ID: com.ver1.gdn0
        TEAM_ID: 6FD7Y7A32X
      groups:
        - appstore_credentials

    scripts:
      - name: Prepare Flutter & CocoaPods
        script: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA (Release)
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
